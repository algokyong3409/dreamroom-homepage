<script>
(function(){
  var siteHeader = document.querySelector('.site-header');
  if (siteHeader) {
    var onScroll = function(){ siteHeader.classList.toggle('is-scrolled', window.scrollY > 40); };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  }
})();
(function(){
  var overlay = document.querySelector('.nav-overlay');
  if (!overlay) return;
  document.querySelectorAll('.nav-drop').forEach(function(drop){
    var highlight = document.createElement('div');
    highlight.className = 'nav-drop-highlight';
    drop.appendChild(highlight);
    drop.querySelectorAll('a').forEach(function(link){
      link.addEventListener('mouseenter', function(){
        var dropRect = drop.getBoundingClientRect();
        var overlayRect = overlay.getBoundingClientRect();
        highlight.style.height = Math.max(overlayRect.bottom - dropRect.top, 0) + 'px';
        highlight.style.opacity = '1';
      });
      link.addEventListener('mouseleave', function(){ highlight.style.opacity = '0'; });
    });
  });
})();
</script>
